<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiPecaito | Links</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Clases personalizadas para el efecto "Liquid Glass" de Apple */
        .liquid-glass {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.1) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        }

        .link-card {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.45);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border-color: rgba(255, 255, 255, 0.6);
        }

        /* Resplandor superior para dar volumen al cristal */
        .glass-highlight {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 100%);
        }
    </style>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body
    class="min-h-screen bg-transparent flex flex-col items-center py-10 px-4 font-sans text-gray-800 antialiased relative overflow-x-hidden">

    <video autoplay muted loop playsinline class="fixed top-0 left-0 w-full h-full object-cover -z-10">
        <source src="assets/vid/bg.mp4" type="video/mp4">
    </video>

    <!-- Overlay para mejorar legibilidad si el video es muy brillante -->
    <div class="fixed top-0 left-0 w-full h-full bg-black/20 -z-10"></div>


    <main
        class="liquid-glass w-full max-w-sm rounded-[2.5rem] p-8 flex flex-col items-center relative overflow-hidden z-10 my-auto">

        <div class="glass-highlight absolute top-0 left-0 w-full h-32 pointer-events-none rounded-t-[2.5rem]"></div>

        <div
            class="w-24 h-24 mb-4 rounded-full p-1 bg-white/30 backdrop-blur-sm border border-white/60 shadow-sm relative z-10">
            <img src="assets/logo/logo.jpeg" alt="MiPecaito" class="w-full h-full rounded-full object-cover">
        </div>

        <p class="text-sm font-bold text-black mb-8 text-center relative z-10 px-4">
            🦞 Servicio de Catering – Barra de Ceviches 🐟
        </p>

        <div class="w-full flex flex-col gap-4 relative z-10">
            <a href="assets/docs/presentacion.pdf" target="_blank"
                class="link-card w-full py-3.5 px-4 rounded-2xl flex items-center justify-between font-semibold text-gray-900 backdrop-blur-md group hover:border-gray-400/50 hover:bg-gray-500/10">
                <span class="flex items-center gap-3">
                    <i data-lucide="file-text" class="w-5 h-5 text-gray-700"></i>
                    Presentación
                </span>
                <i data-lucide="chevron-right"
                    class="w-4 h-4 text-black/50 group-hover:text-gray-700 transition-colors"></i>
            </a>
            <a href="https://www.instagram.com/mipecaitoo?igsh=MXM1anRrYjhnMGRhbg%3D%3D&utm_source=qr" target="_blank"
                class="link-card w-full py-3.5 px-4 rounded-2xl flex items-center justify-between font-semibold text-gray-900 backdrop-blur-md group hover:border-pink-400/50 hover:bg-gradient-to-r hover:from-purple-500/10 hover:to-pink-500/10">
                <span class="flex items-center gap-3">
                    <i data-lucide="instagram" class="w-5 h-5 text-pink-600"></i>
                    Instagram
                </span>
                <i data-lucide="chevron-right"
                    class="w-4 h-4 text-black/50 group-hover:text-pink-600 transition-colors"></i>
            </a>
            <a href="#" target="_blank"
                class="link-card w-full py-3.5 px-4 rounded-2xl flex items-center justify-between font-semibold text-gray-900 backdrop-blur-md group hover:border-blue-400/50 hover:bg-blue-500/10">
                <span class="flex items-center gap-3">
                    <i data-lucide="facebook" class="w-5 h-5 text-blue-600"></i>
                    Facebook
                </span>
                <i data-lucide="chevron-right"
                    class="w-4 h-4 text-black/50 group-hover:text-blue-600 transition-colors"></i>
            </a>
            <a href="https://www.tiktok.com/@mipecaito?_r=1&_t=ZS-94I4dxsiSkW" target="_blank"
                class="link-card w-full py-3.5 px-4 rounded-2xl flex items-center justify-between font-semibold text-gray-900 backdrop-blur-md group hover:border-red-500/50 hover:bg-gradient-to-r hover:from-black/10 hover:to-red-500/10">
                <span class="flex items-center gap-3">
                    <i data-lucide="music-2" class="w-5 h-5 text-black"></i>
                    TikTok
                </span>
                <i data-lucide="chevron-right"
                    class="w-4 h-4 text-black/50 group-hover:text-red-500 transition-colors"></i>
            </a>
            <a href="https://wa.me/525568044036?text=Quiero%20m%C3%A1s%20informaci%C3%B3n%20de%20servicio%20de%20catering"
                target="_blank"
                class="link-card w-full py-3.5 px-4 rounded-2xl flex items-center justify-between font-semibold text-gray-900 backdrop-blur-md group hover:border-green-400/50 hover:bg-green-500/10">
                <span class="flex items-center gap-3">
                    <i data-lucide="message-circle" class="w-5 h-5 text-green-600"></i>
                    WhatsApp
                </span>
                <i data-lucide="chevron-right"
                    class="w-4 h-4 text-black/50 group-hover:text-green-600 transition-colors"></i>
            </a>
        </div>

    </main>

    <script>
        // Inicializar iconos de Lucide
        lucide.createIcons();
    </script>

</body>

</html>
